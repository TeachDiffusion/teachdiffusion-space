name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Lint + compile + YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Discover source files
        id: discover
        run: |
          pyfiles=$(find . -type f -name "*.py" -not -path "./.git/*" -not -path "./.github/*" | tr '\n' ' ')
          ymlfiles=$(find . -type f \( -name "*.yaml" -o -name "*.yml" \) -not -path "./.git/*" -not -path "./.github/*" | tr '\n' ' ')
          {
            echo "pyfiles=$pyfiles"
            echo "ymlfiles=$ymlfiles"
          } >> "$GITHUB_OUTPUT"
          echo "Python: $pyfiles"
          echo "YAML:   $ymlfiles"

      - name: Compile and lint Python
        if: steps.discover.outputs.pyfiles != ''
        run: |
          python -m py_compile ${{ steps.discover.outputs.pyfiles }}
          flake8 ${{ steps.discover.outputs.pyfiles }} \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Validate YAML
        if: steps.discover.outputs.ymlfiles != ''
        run: |
          python -c "
          import sys, yaml
          failed = False
          for path in sys.argv[1:]:
              try:
                  with open(path) as f:
                      yaml.safe_load(f)
                  print(f'OK   {path}')
              except yaml.YAMLError as exc:
                  print(f'FAIL {path}: {exc}', file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          " ${{ steps.discover.outputs.ymlfiles }}
